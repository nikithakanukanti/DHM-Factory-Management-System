<!DOCTYPE html>
<html>
<head>
    <title>DHM Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0;
            text-align: center;
        }

        p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            text-align: center;
        }

        .logout {
            color: #16a34a;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>DHM</h1>

    <p>Factory Digital Entry</p>

    <form method="post" action="/login">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="error"
       th:if="${param.error}">
        Invalid username or password
    </p>

    <p class="logout"
       th:if="${param.logout}">
        You have been logged out
    </p>

</div>

</body>
</html>
